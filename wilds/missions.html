<body data-page="missions"><header class="topbar"><a class="brand-home" href="../index.html"><img class="brand-monhundb" src="../wordmark_monhundb.png" alt="MonHunDB"><img class="header-logo" src="data/images/logo_mhwilds.png" alt="Monster Hunter Wilds"></a><div class="header-left"><a class="header-icon-btn header-icon-btn--label" href="decorations.html">Adornos</a><a class="header-icon-btn header-icon-btn--label" href="weapons.html">Armas</a><a class="header-icon-btn header-icon-btn--label" href="armor.html">Armaduras</a><a class="header-icon-btn header-icon-btn--label" href="materials.html">Materiales</a><a class="header-icon-btn header-icon-btn--label" href="skills.html">Habilidades</a><a class="header-icon-btn header-icon-btn--label" href="missions.html">Misiones</a></div><div class="header-right"><a class="header-icon-btn header-icon-btn--label" href="index.html">← Inicio Wilds</a><button type="button" id="lang-toggle" class="lang-toggle" title="Idioma / Language"><span class="lang-opt" data-lang="es">ES</span>/<span class="lang-opt" data-lang="en">EN</span></button></div></header>
<main class="decorations-view wilds-missions-view"><div class="decorations-toolbar"><div class="quests-mode-toggle" role="tablist" aria-label="Tipo de misión"><button type="button" class="quest-filter-btn active" data-mode="missions">Missions</button><button type="button" class="quest-filter-btn" data-mode="assignment">Assignments</button><button type="button" class="quest-filter-btn" data-mode="optional">Optional Quests</button><button type="button" class="quest-filter-btn" data-mode="event">Event Quests</button></div><input id="mission-search" class="monster-search" type="search" placeholder="Buscar misión o monstruo…" autocomplete="off"></div><div id="mission-index" class="decorations-index"></div><div id="mission-detail" class="decoration-detail" hidden></div></main><script src="missions.js"></script><script>const lt=document.getElementById('lang-toggle');let l=localStorage.getItem('mh-lang')||'es';function syncLang(){lt.dataset.lang=l;lt.querySelectorAll('.lang-opt').forEach(x=>x.classList.toggle('active',x.dataset.lang===l));}syncLang();lt.addEventListener('click',()=>{l=l==='es'?'en':'es';localStorage.setItem('mh-lang',l);syncLang();});</script></body></html>
