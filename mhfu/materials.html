<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-i18n="titleMaterials">Materiales — Bestiario MH Rise: Sunbreak</title>
<link rel="icon" type="image/webp" href="../favicon.webp" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="materials">
  <header class="topbar">
    <a id="brand-home" class="brand-home" href="../index.html" title="Bestiario" aria-label="Volver al inicio">
      <img class="brand-monhundb" src="../wordmark_monhundb.png" alt="MonHunDB">
      <img id="header-logo-img" class="header-logo" src="data/images/logo_mhfu.png" alt="MH Freedom Unite">
    </a>
    <div class="header-left" id="header-left">
      <a class="header-icon-btn header-icon-btn--label" href="decorations" title="Decorations" data-i18n="decorationsNav">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l3 5-9 13L3 8z"/><path d="M3 8h18M9 3l3 5-3 13M15 3l-3 5 3 13"/></svg>
      </a>
      <a class="header-icon-btn header-icon-btn--label" href="weapons" title="Weapons" data-i18n="weaponsNav">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/></svg>
      </a>
      <a class="header-icon-btn header-icon-btn--label" href="armor" title="Armor" data-i18n="armorNav">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6z"/></svg>
      </a>
      <a class="header-icon-btn header-icon-btn--label" href="materials" title="Materials" data-i18n="materialsNav">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6 6 1-4.5 4 1 6-5.5-3-5.5 3 1-6L3 9l6-1z"/></svg>
      </a>
      <a class="header-icon-btn header-icon-btn--label" href="skills" title="Skills" data-i18n="skillsNav">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
      </a>
      <a class="header-icon-btn header-icon-btn--label" href="quests" title="Quests" data-i18n="questsNav">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 13h6M9 17h6"/></svg>
      </a>
    </div>
    <div class="header-center">
      <div class="selector-wrap" id="monster-combobox">
        <button type="button" id="monster-trigger" class="monster-trigger" aria-haspopup="listbox" aria-expanded="false">
          <img class="trigger-icon" alt="" hidden />
          <span class="trigger-label" data-i18n="selectPlaceholder">— Elige un monstruo o su versión —</span>
          <span class="trigger-caret" aria-hidden="true"></span>
        </button>
        <div id="monster-panel" class="monster-panel" hidden>
          <input type="text" id="monster-search" class="monster-search" data-i18n-ph="searchPlaceholder" placeholder="Buscar…" autocomplete="off" />
          <div id="monster-list" class="monster-list" role="listbox"></div>
        </div>
      </div>
    </div>
    <div class="header-right">
      <div class="global-search-wrap" id="global-search-wrap">
        <button type="button" id="global-search-toggle" class="header-icon-btn" title="Buscar" aria-expanded="false" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        </button>
        <div id="global-search-panel" class="global-search-panel" hidden>
          <input type="text" id="global-search-input" class="monster-search" data-i18n-ph="globalSearchPlaceholder" placeholder="Buscar monstruo o material…" autocomplete="off" />
          <div id="global-search-results" class="global-search-results"></div>
        </div>
      </div>
      <button type="button" id="lang-toggle" class="lang-toggle" title="Idioma / Language">
        <span class="lang-opt" data-lang="es">ES</span>/<span class="lang-opt" data-lang="en">EN</span>
      </button>
    </div>
  </header>

    <main id="materials-view" class="decorations-view">
    <div class="decorations-toolbar">
      <div id="materials-mode-toggle" class="materials-mode-toggle" role="group" aria-label="Vista de materiales">
        <button type="button" class="active" data-materials-mode="items" data-i18n="materialsItemsList">Materiales / Items</button>
        <button type="button" data-materials-mode="combinations" data-i18n="combinationList">Lista de combinaciones</button>
      </div>
      <input type="text" id="materials-search" class="monster-search" data-i18n-ph="materialsSearchPlaceholder" placeholder="Buscar material…" autocomplete="off" />
    </div>
    <div id="materials-index" class="decorations-index"></div>
    <div id="material-detail" class="decoration-detail" hidden></div>
  </main>

  <script src="data/i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
